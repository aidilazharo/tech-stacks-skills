name: Sync main to enterprise release PR

# Retained manual fallback; source-side weekday schedule disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Copy main and open destination PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate configured destination
        id: destination
        shell: bash
        env:
          TARGET_URL: ${{ vars.SYNC_TARGET_REPO_URL || 'https://github.com/aiamalaysia/my-fow-technology-app-techassists-enterprise-skills' }}
          TARGET_TOKEN: ${{ secrets.SYNC_TARGET_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_TOKEN" ]]; then
            echo "::error::Configure Actions secret SYNC_TARGET_TOKEN in this source repository."
            exit 1
          fi
          url="$TARGET_URL"
          url="${url%/}"
          url="${url%.git}"
          if [[ ! "$url" =~ ^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::SYNC_TARGET_REPO_URL must be https://github.com/OWNER/REPO"
            exit 1
          fi
          repo="${url#https://github.com/}"
          if [[ "$repo" == "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Source and destination must be different repositories."
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Destination: $repo" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout source main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout destination main
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.destination.outputs.repo }}
          ref: main
          path: target
          token: ${{ secrets.SYNC_TARGET_TOKEN }}
          persist-credentials: true

      - name: Create release branch and synchronize files
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name 'github-actions[bot]'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # A fresh branch always starts from the destination main, not from
          # the unrelated source repository's Git history.
          date_kl="$(TZ=Asia/Kuala_Lumpur date +%Y%m%d)"
          branch="release/main-sync-${date_kl}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C target switch -c "$branch"

          # Mirror checked-out source files, including deletions. Preserve Git
          # metadata, and do not copy this source-only scheduled workflow into
          # the destination (avoids accidental reverse/recursive synchronization).
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/sync-to-enterprise.yml' \
            source/ target/

          git -C target add -A
          if git -C target diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No differences from destination main; no branch or PR needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          source_sha="$(git -C source rev-parse HEAD)"
          git -C target commit -m "chore(sync): mirror ${GITHUB_REPOSITORY}@${source_sha}"
          git -C target push --set-upstream origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Create pull request against destination main
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TARGET_TOKEN }}
          TARGET_REPO: ${{ steps.destination.outputs.repo }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          set -euo pipefail
          pr_body="$(printf 'Automated weekday mirror of %s \`main\` into the destination repository.\n\n- Source commit: \`%s\`\n- Destination base: \`main\`\n- Schedule: weekdays, 20:00 Asia/Kuala_Lumpur\n- Merge: requires PR review/approval; no automatic merge.\n\nThis PR synchronizes files and deletions. The source-only \`sync-to-enterprise.yml\` workflow is intentionally excluded.\n' "$GITHUB_REPOSITORY" "$SOURCE_SHA")"
          pr_url="$(gh pr create \
            --repo "$TARGET_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "chore(sync): ${GITHUB_REPOSITORY} main (${SOURCE_SHA:0:12})" \
            --body "$pr_body")"
          echo "Created destination PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          echo "$pr_url"
