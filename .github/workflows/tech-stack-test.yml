name: Validate technology starters
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run offline read-only validation
        run: |
          node scripts/validate-catalog.mjs
                    node --test tech-stacks/nestjs/scaffold/test/static.test.mjs
                    node --check tech-stacks/react/scaffold/server/index.mjs
                    node --check tech-stacks/angular/scaffold/server/index.mjs
