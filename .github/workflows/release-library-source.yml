name: Package SDLC Library source ZIP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-source-main
  cancel-in-progress: false

jobs:
  verify-catalog:
    name: Validate Library and asset integrity
    runs-on: ${{ vars.ATGV_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/validate-webview-libraries.mjs
      - run: node --test tests/*.test.mjs ai-harness/tests/*.test.mjs tech-stacks/nestjs/scaffold/test/static.test.mjs

  verify-starters:
    name: Verify ${{ matrix.stack }} starter
    runs-on: ${{ vars.ATGV_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [react, angular, nestjs]
    defaults:
      run:
        working-directory: tech-stacks/${{ matrix.stack }}/scaffold
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  archive:
    name: Verify and publish complete Library source ZIP
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: [verify-catalog, verify-starters]
    runs-on: ${{ vars.ATGV_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - name: Checkout Library
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Library manifest and version
        shell: bash
        run: |
          set -euo pipefail
          test -s VERSION
          test -s catalog.json
          test -d roles
          test -d tech-stacks
          test -d ai-harness
          node -e '
            const fs=require("node:fs");
            const version=fs.readFileSync("VERSION","utf8").trim();
            const m=JSON.parse(fs.readFileSync("catalog.json","utf8"));
            if(!/^\d+\.\d+\.\d+$/.test(version)||m.schema!==1||m.version!==version||
               !Array.isArray(m.roles)||!m.roles.length||!Array.isArray(m.techStacks)||!m.techStacks.length)
              throw Error("Library metadata does not match VERSION");
          '

      - name: Archive committed Library source
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          filename="tech-stacks-skills-${version}-source.zip"
          mkdir -p dist
          git archive --format=zip --prefix="tech-stacks-skills-${version}/" -o "dist/${filename}" HEAD
          unzip -tqq "dist/${filename}"
          if unzip -Z1 "dist/${filename}" | grep -E '(^|/)\.memory(/|$)'; then
            echo "ERROR: .memory must not be included in Library release artifacts" >&2
            exit 1
          fi
          echo "Verified: no .memory directory in release ZIP" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum "${filename}" > library-source.sha256)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
          {
            echo "### SDLC Library v${version}"
            echo "Complete source ZIP: ${filename}"
            echo "Verified source commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Library ZIP as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech-stacks-skills-source-${{ steps.archive.outputs.version }}-${{ github.run_number }}
          path: |
            dist/${{ steps.archive.outputs.filename }}
            dist/library-source.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish source archive release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.archive.outputs.version }}
          FILE: ${{ steps.archive.outputs.filename }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-source-build.${BUILD}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "dist/${FILE}" "dist/library-source.sha256" \
              --target "$GITHUB_SHA" \
              --title "SDLC Library v${VERSION} — source archive (build ${BUILD})" \
              --notes "Full, committed SDLC Library source including technology stacks, role skills and AI harness. Verified ZIP and SHA-256 checksum." \
              --prerelease --latest=false
          else
            gh release upload "$tag" "dist/${FILE}" "dist/library-source.sha256" --clobber
          fi
