name: Sync SDLC Library to AIA Malaysia

on:
  workflow_run:
    workflows: ["Package SDLC Library source ZIP"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without creating a branch or PR
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: atgv-aiamalaysia-library-distribution
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'aidilazharo/tech-stacks-skills' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check destination credential
        env:
          DEST_TOKEN: ${{ secrets.AIAMALAYSIA_PAT }}
        run: test -n "$DEST_TOKEN" || { echo "::error::Configure the approved AIAMALAYSIA_PAT repository secret."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aiamalaysia/my-fow-technology-app-techassists-enterprise-skills
          ref: main
          path: destination
          fetch-depth: 0
          token: ${{ secrets.AIAMALAYSIA_PAT }}
      - name: Synchronize verified source and open PR
        env:
          SOURCE_TOKEN: ${{ github.token }}
          DEST_TOKEN: ${{ secrets.AIAMALAYSIA_PAT }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python3 source/scripts/aiamalaysia-sync.py sync
