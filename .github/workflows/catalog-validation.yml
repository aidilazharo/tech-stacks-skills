name: Validate SDLC catalog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-catalog-validation:
    name: Catalog checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate catalog metadata and assets
        run: node scripts/validate-catalog.mjs
      - name: Verify catalog manifest diagnostic
        run: node --test tests/catalog-bootstrap-audit.test.mjs
      - name: Verify NestJS static smoke test
        run: node --test tech-stacks/nestjs/scaffold/test/static.test.mjs
      - name: Verify AIA QI design kit
        run: node shared/design-systems/aia-qi/kit/tests/verify.js
      - name: Verify starter JavaScript syntax
        run: |
          node --check scripts/validate-catalog.mjs
          node --check scripts/audit-bootstrap-manifest.mjs
          node --check tech-stacks/react/scaffold/server/index.mjs
          node --check tech-stacks/react/scaffold/server/api.test.mjs
          node --check tech-stacks/angular/scaffold/server/index.mjs
          node --check tech-stacks/angular/scaffold/server/api.test.mjs
