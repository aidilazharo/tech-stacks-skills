name: Validate AI Harness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run offline read-only validation
        run: |
          node ai-harness/scripts/validate.mjs
          node --test ai-harness/tests/harness.test.mjs ai-harness/tests/agent-quality.test.mjs
      - name: Evaluate synthetic agent quality traces (offline)
        run: node ai-harness/scripts/run-agent-quality-suite.mjs --out agent-quality-report.json
      - name: Upload redacted agent quality report
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-synthetic-report
          path: agent-quality-report.json
          if-no-files-found: error
          retention-days: 14
