name: Check AIA repository access (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-access:
    name: Verify source to AIA access
    runs-on: ${{ vars.SYNC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify own repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.name'
          echo 'Source main: accessible' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify AIA repository using configured PAT
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TARGET_TOKEN }}
          TARGET_URL: ${{ vars.SYNC_TARGET_REPO_URL || 'https://github.com/aiamalaysia/my-fow-technology-app-techassists-enterprise-skills' }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Missing secret SYNC_TARGET_TOKEN.'
            exit 1
          fi
          url="${TARGET_URL%/}"
          url="${url%.git}"
          if [[ ! "$url" =~ ^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo '::error::SYNC_TARGET_REPO_URL must be https://github.com/OWNER/REPO'
            exit 1
          fi
          repo="${url#https://github.com/}"
          if ! result="$(gh api "repos/${repo}/branches/main" --jq '.name' 2>&1)"; then
            if [[ "$result" == *"IP allow list"* ]]; then
              echo '::error::AIA organization IP allow list blocks this runner (HTTP 403). Use an approved-IP runner via SYNC_RUNNER; changing PAT alone will not fix this.'
            else
              echo "::error::Cannot read ${repo}:main: $result"
            fi
            exit 1
          fi
          echo "AIA destination ${repo}:main: accessible" >> "$GITHUB_STEP_SUMMARY"
