name: Cleanup merged branches and completed runs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (uncheck to delete)
        type: boolean
        default: true
      cleanup_branches:
        description: Delete safe merged PR branches
        type: boolean
        default: true
      cleanup_runs:
        description: Delete all completed workflow runs and their artifacts
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: repository-maintenance-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      CLEAN_BRANCHES: ${{ inputs.cleanup_branches }}
      CLEAN_RUNS: ${{ inputs.cleanup_runs }}
      REPO: ${{ github.repository }}
      CURRENT_RUN: ${{ github.run_id }}
    steps:
      - name: Clean verified merged branches and completed workflow history
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          root = os.environ["GITHUB_API_URL"] + "/repos/" + repo
          dry = os.environ["DRY_RUN"].lower() == "true"
          current_run = int(os.environ["CURRENT_RUN"])
          deleted_branches = deleted_runs = 0
          branch_errors = []

          def api(path="", method="GET", params=None, missing=False):
              url = root + path + ("?" + urlencode(params) if params else "")
              for attempt in range(12):
                  request = Request(url, method=method, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ATGV-repository-cleanup"
                  })
                  try:
                      with urlopen(request, timeout=45) as response:
                          data = response.read()
                          return json.loads(data) if data else True
                  except HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      if exc.code == 404 and missing:
                          return None
                      retry = exc.headers.get("Retry-After")
                      remaining = exc.headers.get("X-RateLimit-Remaining")
                      throttled = exc.code == 429 or (
                          exc.code == 403 and (retry or remaining == "0"
                          or "secondary rate limit" in body.lower()))
                      if throttled and attempt < 11:
                          delay = max(60, int(retry or 0))
                          if remaining == "0":
                              delay = max(delay, int(exc.headers.get(
                                  "X-RateLimit-Reset", "0")) - int(time.time()) + 5)
                          print("GitHub rate limit; retrying after", delay, "seconds", flush=True)
                          time.sleep(delay)
                          continue
                      raise RuntimeError(f"{method} {path}: HTTP {exc.code}: {body}") from exc
              raise RuntimeError("API retry limit reached")

          def pulls(state, **extra):
              page = 1
              while True:
                  rows = api("/pulls", params={"state": state, "per_page": 100,
                                               "page": page, **extra})
                  yield from rows
                  if len(rows) < 100:
                      break
                  page += 1

          default = api()["default_branch"]
          preserved = {default, "main", "master", "develop", "development",
                       "staging", "production"}
          print("Mode:", "DRY RUN" if dry else "DELETE", flush=True)

          if os.environ["CLEAN_BRANCHES"].lower() == "true":
              candidates = {}
              for pr in pulls("closed"):
                  head = pr.get("head") or {}
                  if (not pr.get("merged_at") or pr["base"]["ref"] != default
                      or (head.get("repo") or {}).get("full_name") != repo
                      or head.get("ref") in preserved):
                      continue
                  candidates.setdefault(head["ref"], set()).add(head["sha"])

              open_refs = set()
              for pr in pulls("open"):
                  for end in ("head", "base"):
                      ref = pr[end]
                      if (ref.get("repo") or {}).get("full_name") == repo:
                          open_refs.add(ref["ref"])

              eligible = 0
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run(["git", "init", "-q", directory], check=True)
                  for branch, merged_shas in sorted(candidates.items()):
                      if branch in open_refs:
                          continue
                      path = "/branches/" + quote(branch, safe="")
                      current = api(path, missing=True)
                      if not current or current.get("protected"):
                          continue
                      sha = current["commit"]["sha"]
                      if sha not in merged_shas:
                          continue
                      # Recheck open PRs immediately before any destructive operation.
                      if any(pulls("open", head=repo.split("/")[0] + ":" + branch)):
                          continue
                      if any(pulls("open", base=branch)):
                          continue
                      current = api(path, missing=True)
                      if not current or current.get("protected") or current["commit"]["sha"] != sha:
                          continue
                      eligible += 1
                      if dry:
                          print("Would delete merged branch:", branch, flush=True)
                          continue
                      ref = "refs/heads/" + branch
                      # A compare-and-delete lease protects a branch that advances after inspection.
                      result = subprocess.run([
                          "git", "-C", directory, "-c", "credential.helper=",
                          "-c", "credential.helper=!gh auth git-credential",
                          "push", "--force-with-lease=" + ref + ":" + sha,
                          os.environ["GITHUB_SERVER_URL"] + "/" + repo + ".git",
                          ":" + ref
                      ], text=True, capture_output=True, env={**os.environ, "GIT_TERMINAL_PROMPT": "0"})
                      if result.returncode:
                          branch_errors.append(branch)
                          print("Branch deletion refused:", branch, result.stderr.strip(), flush=True)
                      else:
                          deleted_branches += 1
                          print("Deleted merged branch:", branch, flush=True)
                          time.sleep(1.1)
              print("Eligible merged branches:", eligible, flush=True)

          if os.environ["CLEAN_RUNS"].lower() == "true":
              query = {"status": "completed", "per_page": 100}
              initial = api("/actions/runs", params=query)
              print("Completed workflow runs at start:", initial["total_count"], flush=True)
              if not dry:
                  while True:
                      batch = api("/actions/runs", params=query)["workflow_runs"]
                      ids = [r["id"] for r in batch
                             if r["status"] == "completed" and r["id"] != current_run]
                      if not ids:
                          break
                      # Always read page 1 again after deletion; no shifting-page omissions.
                      for run_id in ids:
                          outcome = api("/actions/runs/" + str(run_id),
                                        method="DELETE", missing=True)
                          if outcome:
                              deleted_runs += 1
                              print("Deleted completed run:", run_id, flush=True)
                          time.sleep(1.1)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Repository cleanup\n\n")
              summary.write(f"- Dry run: {dry}\n")
              summary.write(f"- Merged branches deleted: {deleted_branches}\n")
              summary.write(f"- Completed workflow runs deleted: {deleted_runs}\n")
              summary.write(f"- Branch deletions refused: {len(branch_errors)}\n")
              summary.write("- PR records, published releases, tags and active runs are preserved.\n")
          if branch_errors:
              raise SystemExit("One or more branch deletions were refused; see logs.")
          PY
