<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New page · Qi-inspired starter</title>
  <link rel="stylesheet" href="../css/qi.css">
</head>
<body>
  <header class="qi-bg-white qi-border qi-py-4">
    <div class="qi-container qi-flex qi-align-center qi-justify-between">
      <span class="qi-brand"><span class="qi-brand-mark">Q</span> Project starter</span>
      <button class="qi-btn qi-btn-secondary qi-btn-sm" data-qi-theme-toggle aria-pressed="false">◐ Theme</button>
    </div>
  </header>
  <main class="qi-container qi-page">
    <nav aria-label="Breadcrumb"><ol class="qi-breadcrumb"><li>Home</li><li aria-current="page">New screen</li></ol></nav>
    <header class="qi-mt-6 qi-mb-6"><h1>Page title</h1><p class="qi-text-muted qi-mt-2">One sentence explaining this page’s purpose and most important action.</p></header>
    <div class="qi-row">
      <section class="qi-col-12 qi-col-lg-8 qi-card" aria-labelledby="section-title">
        <h2 id="section-title">Main task</h2>
        <p class="qi-text-muted qi-mt-2 qi-mb-6">Use business requirements to replace this placeholder content.</p>
        <div class="qi-field qi-mb-4"><label class="qi-label" for="example-field">Your label</label><input id="example-field" class="qi-input" placeholder="Enter a value"></div>
        <button type="button" class="qi-btn qi-btn-primary" data-qi-toast="This is a starter demo action.">Primary action</button>
      </section>
      <aside class="qi-col-12 qi-col-lg-4 qi-card"><h3>Helpful context</h3><p class="qi-text-sm qi-text-muted qi-mt-3">Place guidance, next steps and contextual information here.</p></aside>
    </div>
  </main>
  <script src="../js/qi.js"></script>
</body>
</html>
